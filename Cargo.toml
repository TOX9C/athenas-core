[workspace]
members = [
  "src-tauri", # Tauri backend
  "frontend", # Dioxus frontend
  "crates/athena-core",
  "crates/athena-fs",
  "crates/athena-git",
  "crates/athena-store",
  "crates/athena-browser",
  "crates/athena-plugins",
  "crates/athena-terminal",
  "crates/athena-resume-scanner",
]
resolver = "2"

[workspace.package]
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.15", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
path-clean = "1.0"
url = "2.5"
libc = "0.2"

# Dev profile keeps the default "unwind" panic strategy for useful
# stack traces during debugging. This is explicit (not just a comment)
# because wasm32-unknown-unknown's *target* default is still `abort`
# even though the host targets default to `unwind`. If the WASM frontend
# is ever built in dev (e.g. `dx build` without `--release`), `abort`
# would skip RefCell-guard unwinding and re-introduce the poisoned-cell
# freeze described under [profile.release].
[profile.dev]
panic = "unwind"

[profile.dev.package.dioxus-web]
# Workaround: Dioxus devtools try to open a WebSocket for hot-reload,
# which WKWebView rejects with SecurityError. Disable debug assertions
# to prevent this from panicking the WASM runtime in debug builds.
debug-assertions = false

[profile.release]
opt-level = "z"
strip = true
lto = true
# Using "unwind" instead of "abort" so that RefCell guards are properly
# dropped if a Dioxus task panics under a JS timer callback.  Without
# unwinding, the runtime’s RefCell remains mutably-borrowed, making
# every subsequent render or task poll hit the poisoned cell and crash
# the WASM runtime until the page is reloaded.
panic = "unwind"

# The terminal grid/parser and the core orchestrator are hot per-keystroke
# paths, not size-constrained; the global "z" leaves them at a fraction of
# their achievable speed. Per-package overrides restore speed while the
# remaining WASM payload keeps the workspace-wide "z" sizing.
[profile.release.package.athena-terminal]
opt-level = 3

[profile.release.package.athena-core]
opt-level = 3

# The PTY read-loop/flush glue in src-tauri is a hot per-output-chunk path;
# "z" sizing throttles the 8ms flush pipeline.
[profile.release.package.athenas-core]
opt-level = 3

# The Dioxus frontend itself: every render pass, signal read/write, rsx
# diff, and JS interop shim lives here. "z" trades inlining, unrolling,
# and vectorization for size on the single hottest user-facing crate in
# the app (the "release UI feels slow" root cause): its cost multiplies
# every per-chunk and per-frame path. Speed wins over a modest WASM size
# increase; the binary ships inside a DMG where ~1MB is irrelevant.
[profile.release.package.athena-frontend]
# Measured (2026-10-19, post-wasm-opt -Oz): "z" → 3,012,796 B; 2 → 4,645,667 B;
# 3 → 4,539,991 B. Level 3 is both faster and smaller than 2 (LTO's stronger
# inlining at 3 leaves less call-overhead code than 2's partial inlining).
opt-level = 3

# Local patch of tauri-plugin-webdriver-automation (patches/ holds the
# vendored 0.1.3 with two fixes): the child-webview registration guard in
# lib.rs, and a bounded 8s wait-for-window in the window endpoints' no-label
# fallback — a tauri-wd session spawn reaches GET /window ~0.5s after
# posix_spawn while the app's first window registers ~2-3s later (WKWebView
# web-content respawn on cold spawn), so the instant "no window" answer made
# every e2e session creation racy.
[patch.crates-io]
tauri-plugin-webdriver-automation = { path = "patches/tauri-plugin-webdriver-automation" }
