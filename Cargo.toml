[workspace]
members = [
  "src-tauri", # Tauri backend
  "frontend", # Dioxus frontend
  "crates/athena-core",
  "crates/athena-fs",
  "crates/athena-store",
  "crates/athena-browser",
  "crates/athena-plugins",
  "crates/athena-terminal",
  "crates/athena-resume-scanner",
]
resolver = "2"

[workspace.package]
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.15", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
path-clean = "1.0"
url = "2.5"

# Dev profile keeps the default "unwind" panic strategy for useful
# stack traces during debugging. This is explicit (not just a comment)
# because wasm32-unknown-unknown's *target* default is still `abort`
# even though the host targets default to `unwind`. If the WASM frontend
# is ever built in dev (e.g. `dx build` without `--release`), `abort`
# would skip RefCell-guard unwinding and re-introduce the poisoned-cell
# freeze described under [profile.release].
[profile.dev]
panic = "unwind"

[profile.dev.package.dioxus-web]
# Workaround: Dioxus devtools try to open a WebSocket for hot-reload,
# which WKWebView rejects with SecurityError. Disable debug assertions
# to prevent this from panicking the WASM runtime in debug builds.
debug-assertions = false

[profile.release]
opt-level = "z"
strip = true
lto = true
# Using "unwind" instead of "abort" so that RefCell guards are properly
# dropped if a Dioxus task panics under a JS timer callback.  Without
# unwinding, the runtime’s RefCell remains mutably-borrowed, making
# every subsequent render or task poll hit the poisoned cell and crash
# the WASM runtime until the page is reloaded.
panic = "unwind"
