[workspace]
members = [
  "src-tauri", # Tauri backend
  "frontend", # Dioxus frontend
  "crates/athena-core",
  "crates/athena-terminal",
  "crates/athena-fs",
  "crates/athena-store",
  "crates/athena-browser",
  "crates/athena-plugins",
]
resolver = "2"

[workspace.package]
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.15", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
path-clean = "1.0"

[profile.release]
opt-level = "z"
strip = true
