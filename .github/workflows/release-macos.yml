name: macOS Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the verified DMG to the GitHub release'
        required: true
        default: false
        type: boolean
      version:
        description: 'Version to build for a manual dispatch (for example 0.3.0)'
        required: true
        default: '3.5.1'
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
  APPLE_ID: ${{ secrets.APPLE_ID }}
  APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

jobs:
  release:
    runs-on: macos-15
    # 60 -> 75 for the e2e gate's extra debug build (webdriver feature) + suite;
    # a 60-minute cap left no headroom on a cold cargo cache.
    timeout-minutes: 75
    steps:
      - name: Checkout release revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ripgrep (MCP search tests shell out to rg)
        run: brew install ripgrep

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # dx build strips the WASM bundle via rust-objcopy, which dynamically
          # links libLLVM from the llvm-tools component — without it, bundling
          # dies with "Library not loaded: @rpath/libLLVM.dylib".
          components: llvm-tools

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.7.9 --locked

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.1 --locked

      # wasm-opt is no longer needed: dx runs its own downloaded binaryen
      # ([web.wasm_opt] level "z" in frontend/Dioxus.toml).

      - name: Install Cargo audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Install the WebDriver shim and driver for the e2e gate
        # `tauri-wd` — the binary the gate actually runs — does NOT come from
        # the `tauri-driver` crate; it ships with `tauri-webdriver-automation`.
        # Installing only `tauri-driver` leaves `tauri-wd: command not found`,
        # and every gated spec then fails in ~2s with `ECONNREFUSED` on :4444
        # (observed on the PR-time gate's first real run, 2026-11-05).
        run: |
          cargo install tauri-webdriver-automation --version 0.1.3 --locked
          cargo install tauri-driver --locked
          # Each step is a fresh shell, and `cargo install` targets
          # $CARGO_HOME/bin — make it visible to the gate step below.
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Verify release identity
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$(git describe --tags --exact-match)" = "${GITHUB_REF_NAME}"
            expected_version="${GITHUB_REF_NAME#v}"
          else
            expected_version="${{ inputs.version }}"
            if [ "${{ inputs.publish }}" = "true" ]; then
              test "$(git describe --tags --exact-match)" = "v${expected_version}"
            fi
          fi
          test -n "$expected_version"
          printf 'RELEASE_VERSION=%s\n' "$expected_version" >> "$GITHUB_ENV"
          RELEASE_VERSION="$expected_version" node scripts/check-release-identity.mjs
          # $GITHUB_ENV only applies to LATER steps — the inline check below is
          # in the same step, so RELEASE_VERSION must be passed on the env of
          # the node invocation itself.
          RELEASE_VERSION="$expected_version" node - <<'NODE'
          const fs = require('node:fs')
          const expected = process.env.RELEASE_VERSION
          const packageVersion = require('./package.json').version
          const tauriVersion = require('./src-tauri/tauri.conf.json').version
          const cargoVersions = [
            fs.readFileSync('./frontend/Cargo.toml', 'utf8'),
            fs.readFileSync('./src-tauri/Cargo.toml', 'utf8'),
          ].map(text => text.match(/^version\s*=\s*"([^"]+)"/m)?.[1])
          if ([packageVersion, tauriVersion, ...cargoVersions].some(version => version !== expected)) {
            throw new Error(`release version mismatch: expected ${expected}`)
          }
          NODE

      - name: Run release checks
        run: |
          # Build the frontend FIRST: cargo check runs the tauri build script,
          # which validates bundle resource paths under frontend/dist (they do
          # not exist on a fresh checkout until build-dist has run).
          bash frontend/build-dist.sh
          cargo check --workspace --locked
          cargo audit
          # Informational warnings are captured, but compiler/command failures
          # remain blocking. The generated baseline is uploaded with the run.
          node scripts/run-clippy-baseline.mjs
          rustfmt --edition 2021 --check crates/athena-core/src/mcp_transport.rs
          npm test
          npm run test:mcp
          npm run test:release-scripts
          # workflow_dispatch supplies inputs.version; tag pushes resolve via
          # GITHUB_REF_NAME inside the script.
          RELEASE_VERSION="${{ inputs.version }}" npm run check:release-identity
          npm run lint
          npm audit --omit=dev --audit-level=high
          node scripts/check-tauri-command-drift.mjs
          node scripts/check-tauri-permission-drift.mjs
          node scripts/check-plugin-integration.mjs
          cargo test --workspace --locked

      # Terminal-rendering e2e gate. This is the ONLY check that exercises the
      # terminal rendering path — leaked kitty rowcolumn diacritics painting
      # stray marks inside image blocks, orphaned image overlays overpainted on
      # the live pane, stale glyphs after a shared-atlas reset, and the
      # new-terminal mount blackout. Every regression that produced an
      # "unusable" build has been in that class. The `cargo test --workspace`
      # above does run `athena-terminal`'s Rust tests, but no `cargo test` on
      # any platform can see a webview rendering path — and this suite is
      # macOS-only.
      #
      # Curated, not whole-suite, on measured evidence: two full local runs of
      # all 34 specs score 19/34 and 21/34, with 13 specs failing in both runs
      # and again in isolation, plus 2 flaky. Gating the whole suite would
      # block releases for unrelated reasons. Every spec below is in the
      # terminal rendering/geometry class and passed in both runs
      # (`xterm-glyph-coherence` was scoped-repaired and re-verified green
      # after them).
      - name: Terminal-rendering e2e gate (WebDriver)
        timeout-minutes: 30
        run: |
          set -euo pipefail
          # The suite drives the real app through tauri-wd, so it needs a debug
          # binary with the WebDriver automation plugin compiled in.
          bash frontend/build-dist.sh
          cargo build --manifest-path src-tauri/Cargo.toml --features webdriver
          (cd e2e-tests && npm ci)
          # Fail loudly here rather than as every spec's worth of ECONNREFUSED:
          # if the shim is missing, nothing below can work. Its absence is how
          # the PR-time variant of this gate failed on its first real run.
          command -v tauri-wd >/dev/null || {
            echo "::error::tauri-wd is not on PATH — the WebDriver shim (crate tauri-webdriver-automation) did not install"; exit 1; }
          tauri-wd --port 4444 &
          DRIVER_PID=$!
          trap 'kill "$DRIVER_PID" 2>/dev/null || true' EXIT
          # The driver binds fast, but a session races it — wait until the port
          # accepts a connection before starting the runner. (curl exits 0 on
          # any HTTP response, so this is a liveness probe, not a status check.)
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:4444/status; then break; fi
            sleep 1
          done
          cd e2e-tests
          # `new-terminal-no-blackout` is deliberately NOT in this list: its
          # 400 ms no-blank budget is a machine-speed constant, and a 3-vCPU
          # runner's legitimate pane-mount transient measured ~1 s against the
          # ~2 s blackout it targets — too thin a margin to gate on. See
          # e2e-terminal-gate.yml for the full note; the spec still runs in the
          # full suite locally and pre-release.
          npx wdio run wdio.conf.mjs \
            --spec test/specs/xterm-glyph-coherence.e2e.mjs \
            --spec test/specs/pane-garble-focus.e2e.mjs \
            --spec test/specs/zsh-zle-replay.e2e.mjs \
            --spec test/specs/workspace-resize-geometry.e2e.mjs \
            --spec test/specs/pty-broadcast.e2e.mjs

      - name: Note ad-hoc signed release path
        if: ${{ env.APPLE_SIGNING_IDENTITY == '' }}
        run: |
          echo 'No Apple signing credentials configured — publishing an AD-HOC signed DMG.' >&2
          echo 'The app is code signed with identity "-" so Gatekeeper sees a valid,' >&2
          echo 'sealed bundle; users bypass the unsigned-developer warning via' >&2
          echo 'System Settings -> Privacy & Security -> Open Anyway (macOS 15+;' >&2
          echo 'right-click -> Open stopped working in Sequoia).' >&2
          echo 'Configure APPLE_SIGNING_IDENTITY + cert secrets to ship a signed, notarized build.' >&2

      - name: Build ad-hoc signed DMG
        if: ${{ env.APPLE_SIGNING_IDENTITY == '' }}
        # Passing "-" as the signing identity is Tauri's supported way to build
        # an ad-hoc signed bundle: the bundler runs codesign --force --sign -
        # on every nested binary and then the .app itself, which seals
        # Contents/_CodeSignature before the DMG is created.
        #
        # The previous unsigned path dropped the variable entirely. That left
        # the shipped .app with only the linker's Mach-O ad-hoc signature on
        # the main executable ("linkedit-signed") and NO Contents/_CodeSignature
        # directory — `codesign --verify --deep --strict` fails with "code has
        # no resources but signature indicates they must be present", and
        # Gatekeeper reports the app as "damaged" with right-click -> Open NOT
        # working. v3.3.0 shipped in exactly that state.
        #
        # (Do NOT reintroduce `env -u APPLE_SIGNING_IDENTITY`: an empty string
        # identity is also invalid — codesign is invoked with '' — so the two
        # valid states for this variable are "-" here or a real identity below.)
        #
        # APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID must also be UNSET here, not
        # merely empty: the bundler notarizes whenever it can resolve those
        # three variables at all (std::env::var_os — an empty string still
        # counts), and a notarytool submission with empty credentials would
        # fail the build. This step runs only when the signing secrets are
        # absent, so unsetting them is lossless.
        run: env -u APPLE_ID -u APPLE_PASSWORD -u APPLE_TEAM_ID APPLE_SIGNING_IDENTITY='-' cargo tauri build --bundles dmg

      - name: Build signed, notarized, and stapled DMG
        if: ${{ env.APPLE_SIGNING_IDENTITY != '' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_PASSWORD"
          test -n "$APPLE_TEAM_ID"

          keychain_path="$RUNNER_TEMP/build.keychain-db"
          certificate_path="$RUNNER_TEMP/certificate.p12"
          previous_keychain=$(security default-keychain | tr -d '"')
          cleanup() {
            if [ -n "$previous_keychain" ]; then
              security default-keychain -s "$previous_keychain" >/dev/null 2>&1 || true
            fi
            security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
            rm -f "$certificate_path"
          }
          trap cleanup EXIT

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$RUNNER_TEMP" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security unlock-keychain -p "$RUNNER_TEMP" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$RUNNER_TEMP" "$keychain_path"
          identities=$(security find-identity -v -p codesigning "$keychain_path")
          printf '%s\n' "$identities"
          printf '%s\n' "$identities" | grep -F "\"$APPLE_SIGNING_IDENTITY\"" >/dev/null

          # Tauri uses APPLE_SIGNING_IDENTITY for Developer ID signing and
          # APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID for notarytool submission
          # and stapling. Keep this in one build step so the exact artifact
          # later verified is the notarized artifact produced by Tauri.
          cargo tauri build --bundles dmg

      - name: Locate DMG
        id: artifact
        run: |
          dmg=$(find target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)
          test -n "$dmg"
          echo "path=$dmg" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$dmg")" >> "$GITHUB_OUTPUT"

      - name: Verify DMG integrity and checksum
        run: |
          expected="Athena's Core_${RELEASE_VERSION}_aarch64.dmg"
          shasum -a 256 "${{ steps.artifact.outputs.path }}" > "${{ steps.artifact.outputs.path }}.sha256"
          node scripts/verify-macos-artifact.mjs \
            --artifact "${{ steps.artifact.outputs.path }}" \
            --expected-name "$expected" \
            --sha256 "${{ steps.artifact.outputs.path }}.sha256"

      - name: Verify ad-hoc signed artifact
        # Hard gate for the unsigned branch: the app INSIDE the shipped DMG must
        # pass `codesign --verify --deep --strict` (the exact check that failed
        # for v3.3.0's "damaged" DMG). spctl --assess is run for observability;
        # its rejection of an ad-hoc build is expected and not fatal.
        if: ${{ env.APPLE_SIGNING_IDENTITY == '' }}
        run: |
          expected="Athena's Core_${RELEASE_VERSION}_aarch64.dmg"
          node scripts/verify-macos-artifact.mjs \
            --artifact "${{ steps.artifact.outputs.path }}" \
            --expected-name "$expected" \
            --sha256 "${{ steps.artifact.outputs.path }}.sha256" \
            --require-ad-hoc

      - name: Verify signed artifact
        if: ${{ env.APPLE_SIGNING_IDENTITY != '' }}
        run: |
          expected="Athena's Core_${RELEASE_VERSION}_aarch64.dmg"
          node scripts/verify-macos-artifact.mjs \
            --artifact "${{ steps.artifact.outputs.path }}" \
            --expected-name "$expected" \
            --sha256 "${{ steps.artifact.outputs.path }}.sha256" \
            --require-signing \
            --require-notarization

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: athena-macos-${{ github.ref_name }}
          path: |
            clippy-baseline.log
            ${{ steps.artifact.outputs.path }}
            ${{ steps.artifact.outputs.path }}.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        # Decision (2026-09-02): unsigned DMGs ARE published to the public release
        # — no Apple Developer secrets are configured yet and shipping without
        # Developer ID notarization beats shipping nothing. The DMG is ad-hoc
        # signed so its signature is structurally valid (so the "damaged"
        # Gatekeeper failure class cannot occur); users dismiss the
        # "not from an identified developer" warning via System Settings ->
        # Privacy & Security -> Open Anyway (macOS 15+; right-click -> Open
        # no longer bypasses Gatekeeper on Sequoia).
        # Restore the `env.APPLE_SIGNING_IDENTITY != ''` guard on this step when
        # signing secrets exist so a regression to unsigned never publishes silently.
        if: ${{ github.event_name == 'push' || inputs.publish == true }}
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
          files: |
            ${{ steps.artifact.outputs.path }}
            ${{ steps.artifact.outputs.path }}.sha256
