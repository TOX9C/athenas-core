name: Linux Release

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - 'port/**'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the verified artifacts to the GitHub release'
        required: true
        default: false
        type: boolean
      version:
        description: 'Version to build for a manual dispatch (for example 3.4.2)'
        required: true
        default: '3.4.2'
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout release revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev build-essential curl wget libssl-dev ripgrep libasound2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.7.9 --locked

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.1 --locked

      - name: Install dependencies
        run: npm ci

      - name: Verify release identity
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "${GITHUB_REF_NAME##refs/heads/*}" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$(git describe --tags --exact-match)" = "${GITHUB_REF_NAME}"
            expected_version="${GITHUB_REF_NAME#v}"
          fi
          # Branch pushes (port/**): no tag, use the repo version as the
          # gate baseline — the strict tag-match is a release path rule.
          expected_version="${expected_version:-$(node -p "require('./package.json').version")}"
          test -n "$expected_version"
          printf 'RELEASE_VERSION=%s\n' "$expected_version" >> "$GITHUB_ENV"
          RELEASE_VERSION="$expected_version" node scripts/check-release-identity.mjs

      - name: Run release checks
        run: |
          bash frontend/build-dist.sh
          cargo check --workspace --locked
          npm test
          npm run test:mcp
          npm run test:release-scripts
          RELEASE_VERSION="${RELEASE_VERSION:-$(node -p "require('./package.json').version")}" npm run check:release-identity
          npm run lint
          node scripts/check-tauri-command-drift.mjs
          node scripts/check-tauri-permission-drift.mjs
          node scripts/check-plugin-integration.mjs
          # Same exclusion as ci.yml: the terminal crate's PTY fork test
          # binary reproducibly kills Ubuntu runner VMs (README "Testing
          # and QA"). The macOS release workflow runs it; Linux does not.
          cargo test --workspace --exclude athena-terminal --locked

      - name: Build deb + AppImage
        run: cargo tauri build --bundles deb,appimage

      - name: Locate artifacts
        id: artifact
        run: |
          deb=$(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)
          appimage=$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          test -n "$deb" && test -n "$appimage"
          echo "deb_path=$deb" >> "$GITHUB_OUTPUT"
          echo "appimage_path=$appimage" >> "$GITHUB_OUTPUT"

      - name: Checksum artifacts
        run: |
          shasum -a 256 "${{ steps.artifact.outputs.deb_path }}" > "${{ steps.artifact.outputs.deb_path }}.sha256"
          shasum -a 256 "${{ steps.artifact.outputs.appimage_path }}" > "${{ steps.artifact.outputs.appimage_path }}.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: athena-linux-${{ github.ref_name }}
          path: |
            ${{ steps.artifact.outputs.deb_path }}
            ${{ steps.artifact.outputs.deb_path }}.sha256
            ${{ steps.artifact.outputs.appimage_path }}
            ${{ steps.artifact.outputs.appimage_path }}.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.publish == true }}
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', inputs.version) }}
          files: |
            ${{ steps.artifact.outputs.deb_path }}
            ${{ steps.artifact.outputs.deb_path }}.sha256
            ${{ steps.artifact.outputs.appimage_path }}
            ${{ steps.artifact.outputs.appimage_path }}.sha256
