name: Linux Release

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - 'port/**'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the verified artifacts to the GitHub release'
        required: true
        default: false
        type: boolean
      version:
        description: 'Version to build for a manual dispatch (for example 3.4.2)'
        required: true
        default: '3.4.2'
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout release revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev build-essential curl wget libssl-dev ripgrep libasound2-dev xvfb xauth imagemagick

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.7.9 --locked

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.1 --locked

      - name: Install dependencies
        run: npm ci

      - name: Verify release identity
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "${GITHUB_REF_NAME##refs/heads/*}" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$(git describe --tags --exact-match)" = "${GITHUB_REF_NAME}"
            expected_version="${GITHUB_REF_NAME#v}"
          fi
          # Branch pushes (port/**): no tag, use the repo version as the
          # gate baseline — the strict tag-match is a release path rule.
          expected_version="${expected_version:-$(node -p "require('./package.json').version")}"
          test -n "$expected_version"
          printf 'RELEASE_VERSION=%s\n' "$expected_version" >> "$GITHUB_ENV"
          RELEASE_VERSION="$expected_version" node scripts/check-release-identity.mjs

      - name: Run release checks
        run: |
          bash frontend/build-dist.sh
          cargo check --workspace --locked
          npm test
          npm run test:mcp
          npm run test:release-scripts
          RELEASE_VERSION="${RELEASE_VERSION:-$(node -p "require('./package.json').version")}" npm run check:release-identity
          npm run lint
          node scripts/check-tauri-command-drift.mjs
          node scripts/check-tauri-permission-drift.mjs
          node scripts/check-plugin-integration.mjs
          # Same exclusion as ci.yml: the terminal crate's PTY fork test
          # binary reproducibly kills Ubuntu runner VMs (README "Testing
          # and QA"). The macOS release workflow runs it; Linux does not.
          cargo test --workspace --exclude athena-terminal --locked

      - name: Build deb + AppImage
        run: cargo tauri build --bundles deb,appimage

      - name: Locate artifacts
        id: artifact
        run: |
          deb=$(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)
          appimage=$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          test -n "$deb" && test -n "$appimage"
          echo "deb_path=$deb" >> "$GITHUB_OUTPUT"
          echo "appimage_path=$appimage" >> "$GITHUB_OUTPUT"

      - name: Checksum artifacts
        run: |
          shasum -a 256 "${{ steps.artifact.outputs.deb_path }}" > "${{ steps.artifact.outputs.deb_path }}.sha256"
          shasum -a 256 "${{ steps.artifact.outputs.appimage_path }}" > "${{ steps.artifact.outputs.appimage_path }}.sha256"

      - name: Smoke — launch AppImage under Xvfb
        # Real launch evidence (not just "it compiled"): start the built
        # AppImage on a virtual X display, give the Dioxus/WASM UI 15 s to
        # mount, then require the process to still be alive and non-panicked.
        # A crash/panic/failure to open the window exits here — this is the
        # same bar a user hits on first launch.
        run: |
          set -e
          APPIMAGE="${{ steps.artifact.outputs.appimage_path }}"
          chmod +x "$APPIMAGE"

          # Launch under a virtual X server (no FUSE needed with --appimage-extract-and-run).
          APB="$PWD/appimage-bundle"
          mkdir -p "$APB"
          env GDK_BACKEND=x11 WEBKIT_DISABLE_DMABUF_RENDERER=1 \
            xvfb-run -a --server-args="-screen 0 1400x900x24" \
            "$APPIMAGE" --appimage-extract-and-run > "$PWD/smoke.log" 2>&1 &
          echo $! > "$PWD/smoke.pid"

          sleep 15

          PID=$(cat "$PWD/smoke.pid")
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "::error::AppImage exited within 15 s of launch:"
            tail -60 "$PWD/smoke.log"
            exit 1
          fi
          if grep -qiE "panic|segfault|undefined symbol|failed to load" "$PWD/smoke.log"; then
            echo "::error::AppImage reported a panic or load failure:"
            grep -iE "panic|segfault|undefined symbol|failed to load" "$PWD/smoke.log"
            exit 1
          fi

          echo "::notice::smoke OK — process alive after 15 s under Xvfb"
          tail -20 "$PWD/smoke.log"
          kill "$PID" 2>/dev/null || true

      - name: Upload smoke log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log-linux-${{ github.run_id }}
          path: smoke.log
          if-no-files-found: warn

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          # Artifact names reject '/'; branch refs carry one. run_id is
          # unique per run and expressibly safe — no string functions.
          name: athena-linux-${{ github.run_id }}
          path: |
            ${{ steps.artifact.outputs.deb_path }}
            ${{ steps.artifact.outputs.deb_path }}.sha256
            ${{ steps.artifact.outputs.appimage_path }}
            ${{ steps.artifact.outputs.appimage_path }}.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.publish == true }}
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', inputs.version) }}
          files: |
            ${{ steps.artifact.outputs.deb_path }}
            ${{ steps.artifact.outputs.deb_path }}.sha256
            ${{ steps.artifact.outputs.appimage_path }}
            ${{ steps.artifact.outputs.appimage_path }}.sha256
