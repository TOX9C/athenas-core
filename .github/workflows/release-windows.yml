name: Windows Release

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - 'port/**'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the verified artifacts to the GitHub release'
        required: true
        default: false
        type: boolean
      version:
        description: 'Version to build for a manual dispatch (for example 3.4.2)'
        required: true
        default: '3.4.2'
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout release revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ripgrep (MCP search tests shell out to rg)
        # Mirrors the brew install ripgrep on macOS — the mcp-server tests shell out to `rg``.
        run: choco install ripgrep -y --no-progress

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.7.9 --locked

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.1 --locked

      - name: Install dependencies
        run: npm ci

      - name: Verify release identity
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$(git describe --tags --exact-match)" = "${GITHUB_REF_NAME}"
            expected_version="${GITHUB_REF_NAME#v}"
          fi
          # Branch pushes (port/**): no tag — the strict tag-match is a
          # release path rule; the gate falls back to package.json.
          expected_version="${expected_version:-$(node -p "require('./package.json').version")}"
          test -n "$expected_version"
          printf 'RELEASE_VERSION=%s\n' "$expected_version" >> "$GITHUB_ENV"
          RELEASE_VERSION="$expected_version" node scripts/check-release-identity.mjs

      - name: Run release checks
        shell: bash
        run: |
          bash frontend/build-dist.sh
          cargo check --workspace --locked
          npm test
          npm run test:mcp
          npm run test:release-scripts
          RELEASE_VERSION="${RELEASE_VERSION:-$(node -p "require('./package.json').version")}" npm run check:release-identity
          npm run lint
          node scripts/check-tauri-command-drift.mjs
          node scripts/check-tauri-permission-drift.mjs
          node scripts/check-plugin-integration.mjs
          # Platform crates excluded: athena-terminal's suite is Unix-shaped
          # (fork/PTY fixtures); athenas-core's Tauri binary tests run on
          # macOS/Linux runners.
          cargo test --workspace --exclude athena-terminal --exclude athenas-core --locked

      - name: Build MSI installer
        # NSIS fails on "Athena's Core": its template interpolation into
        # the installer macro quoting breaks on the apostrophe (observed:
        # NSISCOMCALL in IsShortcutTarget, installer.nsi line 817). MSI's
        # Handlebars→XML template carries the name correctly. WiX is a
        # first-class Tauri bundle; same WebView2 bootstrapper behavior.
        run: cargo tauri build --bundles msi --verbose

      - name: Locate artifacts
        id: artifact
        shell: bash
        run: |
          setup=$(find target/release/bundle/msi -maxdepth 1 -type f -name '*.msi' -print -quit)
          test -n "$setup"
          echo "setup_path=$setup" >> "$GITHUB_OUTPUT"
          echo "setup_name=$(basename "$setup")" >> "$GITHUB_OUTPUT"

      - name: Checksum artifact
        shell: bash
        run: |
          sha256sum "${{ steps.artifact.outputs.setup_path }}" > "${{ steps.artifact.outputs.setup_path }}.sha256"

      - name: Smoke — install MSI and launch
        # Real launch evidence on the actual OS: silent-install the MSI
        # (requires admin, which windows-latest runners have), start the
        # exe, wait 15 s for Dioxus/WASM mount, then require the process
        # to still be alive. Kill cleanly; keep the smoke log for failure
        # diagnostics.
        shell: pwsh
        run: |
          $msi = "${{ steps.artifact.outputs.setup_path }}"
          Write-Host "Installing: $msi"
          # msiexec's command parser mis-handles the apostrophe in
          # "Athena's Core…msi" even when double-quoted via PowerShell
          # (error 1619: failed to access database). Copy to a plain name
          # before installing — the artifact the user downloads is
          # unaffected; this is only the smoke harness.
          Copy-Item $msi "C:\athena-installer.msi"
          $exit = (Start-Process msiexec -ArgumentList "/i", "C:\athena-installer.msi", "/qn", "/norestart", "/lvx*", "msi.log" -Wait -PassThru).ExitCode
          if ($exit -ne 0) {
            Write-Host "::error::msiexec exit $exit"
            Get-Content msi.log -Tail 40
            exit 1
          }
          # Program install path: productName in Tauri MSI lands under
          # Program Files\<ProductName>. Derive from the MSI filename form
          # "Name_ver_x64_en-US.msi" → install dir keeps the name.
          $exeCandidates = @(
            "C:\Program Files\Athena's Core\athenas-core.exe",
            "C:\Program Files\Athena.s.Core\athenas-core.exe"
          )
          $exe = $exeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { $exe = (Get-ChildItem "C:\Program Files" -Directory | Where-Object { $_.Name -like "Athena*" } | Select-Object -First 1 | ForEach-Object { Join-Path $_.FullName 'athenas-core.exe' }) }
          if (-not (Test-Path $exe)) { Write-Host "::error::Installed exe not found"; Get-ChildItem "C:\Program Files" | Select-Object Name; exit 1 }
          Write-Host "Launching: $exe"
          # GUI subsystem app: no stdio redirection (would fail
          # Start-Process); rely on the process-alive check plus the
          # Tauri log dir on failure.
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) {
            Write-Host "::error::athenas-core exited with code $($p.ExitCode) within 15 s of launch"
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "::notice::smoke OK — process alive after 15 s post-MSI install"

      - name: Upload smoke log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log-windows-${{ github.run_id }}
          path: |
            msi.log
            smoke.out
            smoke.err
          if-no-files-found: warn

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: athena-windows-${{ github.run_id }}
          path: |
            ${{ steps.artifact.outputs.setup_path }}
            ${{ steps.artifact.outputs.setup_path }}.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.publish == true }}
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
          files: |
            ${{ steps.artifact.outputs.setup_path }}
            ${{ steps.artifact.outputs.setup_path }}.sha256
