name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    name: Frontend and release checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print CI identity
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
          echo "Runner: $RUNNER_OS ($(uname -m))"
          node --version
          npm --version
          rustc --version
          cargo --version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.7.9 --locked
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev build-essential curl wget libssl-dev ripgrep libasound2-dev

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend distribution
        run: bash frontend/build-dist.sh

      - name: Check Tauri command registry
        run: node scripts/check-tauri-command-drift.mjs

      - name: Check Tauri permission registry
        run: node scripts/check-tauri-permission-drift.mjs

      - name: Check plugin integration surface
        run: npm run check:plugin-integration

      - name: Check Tauri security configuration
        run: npm run check:tauri-security

      - name: Check release privacy invariants
        run: npm run check:release-privacy

      - name: Check release identity
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          if [ -z "$RELEASE_VERSION" ]; then
            RELEASE_VERSION="$(node -p "require('./package.json').version")"
          else
            # Tag pushes pass the raw ref name (v3.3.1); the check script only
            # strips the prefix from GITHUB_REF_NAME, not from RELEASE_VERSION.
            RELEASE_VERSION="${RELEASE_VERSION#v}"
          fi
          RELEASE_VERSION="$RELEASE_VERSION" npm run check:release-identity

      - name: JavaScript and TypeScript tests
        run: npm test

      - name: MCP package tests
        run: npm run test:mcp

      - name: Release script tests
        run: npm run test:release-scripts

      - name: ESLint
        run: npm run lint

  rust-quality:
    name: Rust check and clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Print CI identity
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
          echo "Runner: $RUNNER_OS ($(uname -m))"
          rustc --version || true
          cargo --version || true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev build-essential curl wget libssl-dev ripgrep libasound2-dev

      - name: Materialize placeholder frontend dist
        # The Tauri build script validates bundle resource paths at compile
        # time. The real dist is produced by frontend/build-dist.sh during
        # release builds; for cargo check/test a placeholder tree is enough.
        run: |
          mkdir -p frontend/dist/assets frontend/dist/vendor
          echo '<!-- placeholder; build-dist.sh writes the real one before bundling -->' > frontend/dist/index.html
          for f in styles.css mobile.html mobile.css manifest.webmanifest sw.js; do
            cp "frontend/public/$f" "frontend/dist/$f"
          done

      - name: cargo check
        run: cargo check --workspace --locked

      - name: cargo clippy (no-regression vs baseline)
        # Fails when a clippy warning appears that is not in
        # scripts/clippy-warning-baseline.txt. Baseline entries are removed
        # as warnings are fixed; never append without reviewing the warning.
        run: node scripts/run-clippy-baseline.mjs

  rust-tests:
    name: Rust tests (Ubuntu, terminal excluded)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print CI identity
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
          echo "Runner: $RUNNER_OS ($(uname -m))"
          rustc --version || true
          cargo --version || true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev build-essential curl wget libssl-dev ripgrep libasound2-dev

      - name: Materialize placeholder frontend dist
        run: |
          mkdir -p frontend/dist/assets frontend/dist/vendor
          echo '<!-- placeholder; build-dist.sh writes the real one before bundling -->' > frontend/dist/index.html
          for f in styles.css mobile.html mobile.css manifest.webmanifest sw.js; do
            cp "frontend/public/$f" "frontend/dist/$f"
          done

      - name: cargo test
        # athena-terminal is excluded from GitHub-hosted Ubuntu: its test
        # binary reproducibly triggers a runner-VM shutdown ("The runner has
        # received a shutdown signal", step cancelled) even with the
        # fork-based session tests skipped — chase history 2026-08-15:
        # 9513db9 own job + capped parallelism → 81764bf cap build
        # parallelism → cf717e5 isolate athena-terminal → 8150e82 skip PTY
        # fork tests on GH Linux → a7881cd full exclusion. The suite is
        # macOS-green and runs in full in the release workflow
        # (release-macos.yml, runs-on: macos-14; v3.4.4 shipped through it
        # 2026-10-15). Re-enable ONLY via a PR that drops --exclude, renames
        # this job, and runs the full suite on ubuntu-latest first — the
        # trigger is not reproducible on macOS. State 2026-10-18: the local
        # wip/terminal-xterm-rewrite branch is stale (one commit, 2026-10-15;
        # main has since shipped 12+ terminal fixes) and does not unblock
        # this; a fresh terminal-rework PR would need its own Ubuntu
        # validation run.
        run: cargo test --workspace --exclude athena-terminal --locked

  security:
    name: Cargo advisory audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print CI identity
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
          echo "Runner: $RUNNER_OS ($(uname -m))"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Cargo audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Cargo advisory audit
        run: cargo audit
