name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.7.9 --locked
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev build-essential curl wget libssl-dev

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend distribution
        run: bash frontend/build-dist.sh

      - name: Check Tauri command registry
        run: node scripts/check-tauri-command-drift.mjs

      - name: Check Tauri permission registry
        run: node scripts/check-tauri-permission-drift.mjs

      - name: Check plugin integration surface
        run: npm run check:plugin-integration

      - name: Check Tauri security configuration
        run: npm run check:tauri-security

      - name: Check release privacy invariants
        run: npm run check:release-privacy

      - name: Check release identity
        run: npm run check:release-identity

      - name: Check release documentation
        run: npm run check:release-docs

      - name: JavaScript and TypeScript tests
        run: npm test

      - name: MCP package tests
        run: npm run test:mcp

      - name: ESLint
        run: npm run lint

      - name: cargo check
        run: cargo check --workspace

      - name: Install Cargo audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Cargo advisory audit
        run: cargo audit

      - name: cargo clippy
        run: cargo clippy --workspace

      - name: cargo test
        # Exclude the Tauri binary crate to avoid OOM during linking on
        # the 7GB runner — its 14 unit tests are covered locally.
        run: cargo test --workspace --exclude athenas-core
        timeout-minutes: 20
