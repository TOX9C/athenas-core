name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev build-essential curl wget libssl-dev

      - name: Create frontend dist stubs
        run: |
          mkdir -p frontend/dist/assets frontend/dist/vendor
          touch frontend/dist/index.html frontend/dist/styles.css

      - name: cargo check
        run: cargo check --workspace

      - name: cargo clippy
        run: cargo clippy --workspace

      - name: cargo test
        # Exclude the Tauri binary crate to avoid OOM during linking on
        # the 7GB runner — its 14 unit tests are covered locally.
        run: cargo test --workspace --exclude athenas-core

      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
