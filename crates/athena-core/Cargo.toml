[package]
name = "athena-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", features = ["json"] }
thiserror = { workspace = true }
regex = "1.10"
uuid = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
