[package]
name = "athena-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.43", features = ["rt", "rt-multi-thread", "sync", "time", "fs", "process", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", features = ["json"] }
shell-escape = "0.1"
thiserror = { workspace = true }
regex = "1.10"
uuid = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
parking_lot = { version = "0.12", features = ["send_guard"] }
libc = "0.2"
athena-store = { path = "../athena-store" }
athena-fs = { path = "../athena-fs" }
secrecy = { version = "0.8", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
wiremock = "0.6"
