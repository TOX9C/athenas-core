[package]
name = "athena-terminal"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
vte = "0.15"
unicode-width = "0.2"
bitflags = { version = "2.9", features = ["serde"] }
nix = { version = "0.31", features = ["term", "process", "fs", "signal"] }
libc = "0.2"
tokio = { version = "1.43", features = ["sync", "rt"] }
tokio-util = { version = "0.7", features = ["codec"] }

[dev-dependencies]
tokio-test = "0.4"
