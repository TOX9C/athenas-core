[package]
name = "athena-terminal"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
serde = { workspace = true }
log = { workspace = true }
vte = "0.15"
bitflags = { version = "2.9", features = ["serde"] }
tokio = { version = "1.43", features = ["sync", "rt", "macros", "time"] }
parking_lot = "0.12"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["term", "process", "fs", "signal"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "rt"] }
tokio-test = "0.4"
