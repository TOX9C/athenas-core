[package]
name = "athena-store"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
dirs = "6.0"
thiserror = { workspace = true }
uuid = { workspace = true }
base64 = "0.22"
sha2 = "0.10"
tokio = { version = "1.43", features = ["rt", "rt-multi-thread", "sync", "fs"] }
parking_lot = { version = "0.12", features = ["send_guard"] }

[dev-dependencies]
tempfile = "3"
