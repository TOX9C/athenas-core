<!doctype html>
<!--
  Headless harness for the kitty-graphics placement defects:

    1. no-orphan-on-replace  — a re-place with the same p= while the image is
       still decoding must not leave an unpositioned <img> in the overlay
       layer (it paints at natural size over the pane).
    2. no-leaked-diacritics  — a placeholder grid whose row/column indices
       index kitty's canonical 297-entry rowcolumn-diacritics table must leak
       ZERO combining marks into the text grid.
    3. scoped-delete         — `a=d,d=I,i=<id>` must delete only that image's
       placements; other images in the pane must survive.

  Loads the SAME vendored xterm.js + addon-kitty-graphics.js the app ships and
  attaches the addon the way xterm_mount.rs does (feed filter +
  __athenaKittySettle), then replays a faithful OMP stream.

  Usage (from the repo root):
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --enable-unsafe-swiftshader --allow-file-access-from-files \
      --virtual-time-budget=30000 --dump-dom \
      "file://$PWD/e2e-tests/test/fixtures/xterm-kitty-placement-harness.html"
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>pending</title>
    <link rel="stylesheet" href="../../../frontend/vendor/xterm/xterm.css" />
    <style>
      body { background: #08090b; margin: 0; font-family: monospace; color: #e7e4dc; }
      .pane { width: 900px; height: 500px; }
      #out { color: #e7e4dc; font-size: 12px; }
    </style>
    <script src="../../../frontend/vendor/xterm/xterm.js"></script>
    <script src="../../../frontend/vendor/xterm/addon-kitty-graphics.js"></script>
  </head>
  <body>
    <div class="pane" id="pane"></div>
    <pre id="out"></pre>
    <script>
      const results = {}
      const ESC = '\x1b'
      const PNG_B64 =
        'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=='

      // kitty's canonical rowcolumn-diacritics table (297 entries), verbatim
      // from kitty's gen/rowcolumn-diacritics.txt. The grid's row/column
      // indices index THIS table, so the addon must recognise every entry.
      const KITTY_DIACRITICS = [
        0x305, 0x30d, 0x30e, 0x310, 0x312, 0x33d, 0x33e, 0x33f, 0x346, 0x34a,
        0x34b, 0x34c, 0x350, 0x351, 0x352, 0x357, 0x35b, 0x363, 0x364, 0x365,
        0x366, 0x367, 0x368, 0x369, 0x36a, 0x36b, 0x36c, 0x36d, 0x36e, 0x36f,
        0x483, 0x484, 0x485, 0x486, 0x487, 0x592, 0x593, 0x594, 0x595, 0x597,
        0x598, 0x599, 0x59c, 0x59d, 0x59e, 0x59f, 0x5a0, 0x5a1, 0x5a8, 0x5a9,
        0x5ab, 0x5ac, 0x5af, 0x5c4, 0x610, 0x611, 0x612, 0x613, 0x614, 0x615,
        0x616, 0x617, 0x657, 0x658, 0x659, 0x65a, 0x65b, 0x65d, 0x65e, 0x6d6,
        0x6d7, 0x6d8, 0x6d9, 0x6da, 0x6db, 0x6dc, 0x6df, 0x6e0, 0x6e1, 0x6e2,
        0x6e4, 0x6e7, 0x6e8, 0x6eb, 0x6ec, 0x730, 0x732, 0x733, 0x735, 0x736,
        0x73a, 0x73d, 0x73f, 0x740, 0x741, 0x743, 0x745, 0x747, 0x749, 0x74a,
        0x7eb, 0x7ec, 0x7ed, 0x7ee, 0x7ef, 0x7f0, 0x7f1, 0x7f3, 0x816, 0x817,
        0x818, 0x819, 0x81b, 0x81c, 0x81d, 0x81e, 0x81f, 0x820, 0x821, 0x822,
        0x823, 0x825, 0x826, 0x827, 0x829, 0x82a, 0x82b, 0x82c, 0x82d, 0x951,
        0x953, 0x954, 0xf82, 0xf83, 0xf86, 0xf87, 0x135d, 0x135e, 0x135f,
        0x17dd, 0x193a, 0x1a17, 0x1a75, 0x1a76, 0x1a77, 0x1a78, 0x1a79,
        0x1a7a, 0x1a7b, 0x1a7c, 0x1b6b, 0x1b6d, 0x1b6e, 0x1b6f, 0x1b70,
        0x1b71, 0x1b72, 0x1b73, 0x1cd0, 0x1cd1, 0x1cd2, 0x1cda, 0x1cdb,
        0x1ce0, 0x1dc0, 0x1dc1, 0x1dc3, 0x1dc4, 0x1dc5, 0x1dc6, 0x1dc7,
        0x1dc8, 0x1dc9, 0x1dcb, 0x1dcc, 0x1dd1, 0x1dd2, 0x1dd3, 0x1dd4,
        0x1dd5, 0x1dd6, 0x1dd7, 0x1dd8, 0x1dd9, 0x1dda, 0x1ddb, 0x1ddc,
        0x1ddd, 0x1dde, 0x1ddf, 0x1de0, 0x1de1, 0x1de2, 0x1de3, 0x1de4,
        0x1de5, 0x1de6, 0x1dfe, 0x20d0, 0x20d1, 0x20d4, 0x20d5, 0x20d6,
        0x20d7, 0x20db, 0x20dc, 0x20e1, 0x20e7, 0x20e9, 0x20f0, 0x2cef,
        0x2cf0, 0x2cf1, 0x2de0, 0x2de1, 0x2de2, 0x2de3, 0x2de4, 0x2de5,
        0x2de6, 0x2de7, 0x2de8, 0x2de9, 0x2dea, 0x2deb, 0x2dec, 0x2ded,
        0x2dee, 0x2def, 0x2df0, 0x2df1, 0x2df2, 0x2df3, 0x2df4, 0x2df5,
        0x2df6, 0x2df7, 0x2df8, 0x2df9, 0x2dfa, 0x2dfb, 0x2dfc, 0x2dfd,
        0x2dfe, 0x2dff, 0xa66f, 0xa67c, 0xa67d, 0xa6f0, 0xa6f1, 0xa8e0,
        0xa8e1, 0xa8e2, 0xa8e3, 0xa8e4, 0xa8e5, 0xa8e6, 0xa8e7, 0xa8e8,
        0xa8e9, 0xa8ea, 0xa8eb, 0xa8ec, 0xa8ed, 0xa8ee, 0xa8ef, 0xa8f0,
        0xa8f1, 0xaab0, 0xaab2, 0xaab3, 0xaab7, 0xaab8, 0xaabe, 0xaabf,
        0xaac1, 0xfe20, 0xfe21, 0xfe22, 0xfe23, 0xfe24, 0xfe25, 0xfe26,
        0x10a0f, 0x10a38, 0x1d185, 0x1d186, 0x1d187, 0x1d188, 0x1d189,
        0x1d1aa, 0x1d1ab, 0x1d1ac, 0x1d1ad, 0x1d242, 0x1d243, 0x1d244,
      ]

      const writeSync = (term, data) => new Promise((resolve) => term.write(data, resolve))

      const newTerm = async (cols, rows) => {
        const term = new window.Terminal({
          fontFamily: 'monospace',
          fontSize: 14,
          scrollback: 5000,
          convertEol: false,
          cols,
          rows,
          theme: { background: '#08090b', foreground: '#e7e4dc' },
        })
        term.open(document.getElementById('pane'))
        const kitty = window.AthenaKitty.attach(term, () => {})
        term.__athenaKittyFeed = kitty.feed
        return { term, kitty }
      }

      // The addon's overlay layer children, with the geometry that decides
      // whether an element is a LIVE overlay or an ORPHAN: an orphan has no
      // left/top/width/height (never positioned by refresh()) yet is visible.
      const layerKids = (term) => {
        const layer = term.element.querySelector('.athena-kitty-layer')
        if (!layer) return []
        return Array.from(layer.children).map((el) => ({
          display: getComputedStyle(el).display,
          positioned: !!(el.style.left && el.style.top && el.style.width && el.style.height),
          natural: [el.naturalWidth, el.naturalHeight],
        }))
      }

      // 1. Re-placing the same placement (p=) while the image is still
      //    decoding must not leave an orphan element behind.
      const scenarioOrphan = async () => {
        const { term, kitty } = await newTerm(80, 24)
        const apc = `${ESC}_Ga=T,f=100,q=2,C=1,i=77,p=5,c=4,r=1;${PNG_B64}${ESC}\\`
        const cell = '\u{10EEEE}\u0305'
        // (U+0305 = kitty canonical index 0 — what OMP emits for row/col 0.)
        // Three placements of the SAME (i,p) in ONE chunk: the first record is
        // replaced while its Image#onload is still pending.
        let payload = ''
        for (let n = 0; n < 3; n++) {
          payload += apc + '\r\n' + cell.repeat(4) + '\r\n'
        }
        const filtered = kitty.feed(new TextEncoder().encode(payload))
        await writeSync(term, filtered)
        await new Promise((r) => setTimeout(r, 600))
        const kids = layerKids(term)
        const orphans = kids.filter((k) => k.display !== 'none' && !k.positioned)
        results['no-orphan-on-replace'] = {
          kids,
          orphans: orphans.length,
          verdict: orphans.length === 0 ? 'PASS' : `FAIL(${orphans.length} orphan overlay(s) painted over the pane)`,
        }
      }

      // 2. A placeholder grid indexing kitty's canonical table must leak ZERO
      //    combining marks into the text grid. Column index >= 123 uses
      //    codepoints a hand-written range table tends to miss; a leaked mark
      //    paints a visible glyph inside the image block.
      const scenarioDiacritics = async () => {
        const { term, kitty } = await newTerm(240, 70)
        const COLS = 222
        const ROWS = 64
        const dia = (i) => String.fromCodePoint(KITTY_DIACRITICS[i])
        let payload = ''
        for (let r = 0; r < ROWS; r++) {
          let row = ''
          for (let c = 0; c < COLS; c++) row += '\u{10EEEE}' + dia(r) + dia(c)
          payload += row + '\r\n'
        }
        const filtered = kitty.feed(new TextEncoder().encode(payload))
        await writeSync(term, filtered)
        await new Promise((r) => setTimeout(r, 600))
        const buf = term.buffer.active
        const leaked = {}
        let sentinels = 0
        for (let y = 0; y < buf.length; y++) {
          const line = buf.getLine(y)
          if (!line) continue
          for (const ch of line.translateToString(true)) {
            const cp = ch.codePointAt(0)
            if (cp === 0xa0) {
              sentinels++
            } else if (cp >= 0x300 && cp <= 0x2dff) {
              const key = 'U+' + cp.toString(16).toUpperCase()
              leaked[key] = (leaked[key] || 0) + 1
            }
          }
        }
        const total = Object.values(leaked).reduce((a, b) => a + b, 0)
        results['no-leaked-diacritics'] = {
          sentinels,
          leakedMarks: leaked,
          leakedTotal: total,
          verdict:
            total === 0
              ? 'PASS'
              : `FAIL(${total} combining marks leaked into the text grid: ${JSON.stringify(leaked)})`,
        }
      }

      // 3. `a=d,d=I,i=<id>` deletes ONLY that image's placements; every other
      //    image in the pane survives.
      const scenarioScopedDelete = async () => {
        const { term, kitty } = await newTerm(100, 24)
        const A = 0x111111
        const B = 0x222222
        const grid = (id, pid, cols, rows) => {
          const fg = `\x1b[38;2;${(id >> 16) & 255};${(id >> 8) & 255};${id & 255}m`
          const rows_ = []
          for (let r = 0; r < rows; r++) {
            let row = fg
            for (let c = 0; c < cols; c++) row += '\u00a0'
            rows_.push(row + '\x1b[39;59m')
          }
          rows_[0] =
            `\x1b_Ga=p,U=1,q=2,i=${id},p=${pid},c=${cols},r=${rows}\x1b\\` + rows_[0]
          return rows_.join('\r\n')
        }
        const send = async (s) => {
          const f = kitty.feed(new TextEncoder().encode(s))
          if (f) await writeSync(term, f)
        }
        await send(`\x1b_Ga=t,f=100,q=2,i=${A};${PNG_B64}\x1b\\`)
        await send(grid(A, 1, 20, 4) + '\r\n')
        await send(`\x1b_Ga=t,f=100,q=2,i=${B};${PNG_B64}\x1b\\`)
        await send(grid(B, 2, 20, 4) + '\r\n')
        await new Promise((r) => setTimeout(r, 600))
        const before = layerKids(term).length
        await send(`\x1b_Ga=d,d=I,i=${A},q=2\x1b\\`)
        await new Promise((r) => setTimeout(r, 400))
        const after = layerKids(term).length
        results['scoped-delete'] = {
          before,
          after,
          verdict:
            before === 2 && after === 1
              ? 'PASS'
              : `FAIL(a=d,d=I,i=${A} left ${after} overlay(s); kitty keeps the other image's)`,
        }
      }

      const run = async () => {
        try {
          await scenarioOrphan()
          await scenarioDiacritics()
          await scenarioScopedDelete()
        } catch (e) {
          results.error = String((e && e.stack) || e)
        }
        results.verdict = {}
        for (const [k, v] of Object.entries(results)) {
          if (v && typeof v.verdict === 'string') results.verdict[k] = v.verdict
        }
        document.getElementById('out').textContent = 'HARNESS_RESULT ' + JSON.stringify(results)
        document.title = 'HARNESS_DONE'
      }
      run()
    </script>
  </body>
</html>
