appId: com.athenas-core.app
productName: "Athena's Core"
directories:
  output: dist-app
  buildResources: resources
files:
  - dist-electron/**/*
  - dist/**/*
mac:
  target: dmg
  category: public.app-category.developer-tools
win:
  target: nsis
linux:
  target:
    - deb
    - AppImage
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
extraResources:
  - from: node_modules/node-pty/build
    to: node-pty/build
