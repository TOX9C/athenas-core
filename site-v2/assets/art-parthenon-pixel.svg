<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 40" shape-rendering="crispEdges" role="img" aria-label="Pixel-art Parthenon in gold on obsidian">
  <!-- palette: obsidian #050505 / gold #E0B64E / deep gold #9E7A2E / pale gold #F0D48A / line #26262B -->
  <!-- background + stars -->
  <rect x="0" y="0" width="32" height="40" fill="#050505"/>
  <g fill="#26262B">
    <rect x="2" y="2" width="1" height="1"/><rect x="29" y="2" width="1" height="1"/>
    <rect x="1" y="6" width="1" height="1"/><rect x="30" y="8" width="1" height="1"/>
    <rect x="2" y="18" width="1" height="1"/><rect x="29" y="19" width="1" height="1"/>
  </g>
  <!-- pediment (stepped triangle) -->
  <g fill="#E0B64E">
    <rect x="15" y="5" width="2" height="1"/>
    <rect x="13" y="6" width="6" height="1"/>
    <rect x="11" y="7" width="10" height="1"/>
    <rect x="9" y="8" width="14" height="1"/>
    <rect x="7" y="9" width="18" height="1"/>
    <rect x="5" y="10" width="22" height="1"/>
  </g>
  <!-- pediment inner cut -->
  <g fill="#050505">
    <rect x="15" y="6" width="2" height="1"/>
    <rect x="13" y="7" width="6" height="1"/>
    <rect x="11" y="8" width="10" height="1"/>
    <rect x="9" y="9" width="14" height="1"/>
  </g>
  <!-- entablature -->
  <rect x="4" y="11" width="24" height="1" fill="#E0B64E"/>
  <rect x="4" y="12" width="24" height="1" fill="#9E7A2E"/>
  <!-- capitals -->
  <g fill="#E0B64E">
    <rect x="5" y="13" width="3" height="1"/><rect x="10" y="13" width="3" height="1"/>
    <rect x="14" y="13" width="4" height="1"/><rect x="19" y="13" width="3" height="1"/>
    <rect x="24" y="13" width="3" height="1"/>
  </g>
  <!-- columns -->
  <g fill="#E0B64E">
    <rect x="6" y="14" width="1" height="12"/><rect x="11" y="14" width="1" height="12"/>
    <rect x="15" y="14" width="1" height="12"/><rect x="16" y="14" width="1" height="12"/>
    <rect x="20" y="14" width="1" height="12"/><rect x="25" y="14" width="1" height="12"/>
  </g>
  <!-- flutes -->
  <g fill="#9E7A2E">
    <rect x="6" y="16" width="1" height="2"/><rect x="6" y="20" width="1" height="2"/>
    <rect x="11" y="16" width="1" height="2"/><rect x="11" y="20" width="1" height="2"/>
    <rect x="15" y="16" width="1" height="2"/><rect x="15" y="20" width="1" height="2"/>
    <rect x="16" y="17" width="1" height="2"/><rect x="16" y="21" width="1" height="2"/>
    <rect x="20" y="16" width="1" height="2"/><rect x="20" y="20" width="1" height="2"/>
    <rect x="25" y="16" width="1" height="2"/><rect x="25" y="20" width="1" height="2"/>
  </g>
  <!-- inner sanctum glow -->
  <rect x="15" y="14" width="2" height="1" fill="#F0D48A"/>
  <!-- steps -->
  <g fill="#E0B64E">
    <rect x="4" y="26" width="24" height="1"/>
    <rect x="3" y="27" width="26" height="1" fill="#9E7A2E"/>
    <rect x="2" y="28" width="28" height="1"/>
  </g>
  <!-- ground -->
  <rect x="2" y="31" width="28" height="1" fill="#26262B"/>
  <!-- meander strip -->
  <g fill="#9E7A2E">
    <rect x="0" y="34" width="2" height="2"/><rect x="2" y="36" width="2" height="2"/>
    <rect x="6" y="34" width="2" height="2"/><rect x="8" y="36" width="2" height="2"/>
    <rect x="12" y="34" width="2" height="2"/><rect x="14" y="36" width="2" height="2"/>
    <rect x="18" y="34" width="2" height="2"/><rect x="20" y="36" width="2" height="2"/>
    <rect x="24" y="34" width="2" height="2"/><rect x="26" y="36" width="2" height="2"/>
  </g>
</svg>
