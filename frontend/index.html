<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Athena's Core</title>
<link rel="stylesheet" href="./styles.css" />
<link rel="stylesheet" href="./mobile.css" />
<link rel="stylesheet" href="./vendor/xterm/xterm.css" />
<style>
#wasm-loading {
  position: fixed; inset: 0; display: flex; align-items: center;
  justify-content: center; background: var(--bg, #0b0e13);
  color: var(--textDim, #525a6e); font-family: inherit;
  flex-direction: column; gap: 12px; z-index: 9999;
  transition: opacity 0.3s; pointer-events: none;
}
#wasm-loading.loading { pointer-events: none; }
#wasm-loading.done { opacity: 0; pointer-events: none; visibility: hidden; }
.spinner {
  width: 32px; height: 32px; border: 3px solid var(--border, #2a303e);
  border-top-color: var(--accent, #38bdf8); border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#console-log {
  position: fixed; bottom: 0; left: 0; right: 0; max-height: 250px;
  overflow-y: auto; background: rgba(0,0,0,0.95); color: #ccc;
  font-family: 'SF Mono', 'Menlo', monospace; font-size: 11px;
  padding: 8px; z-index: 99999; display: none; pointer-events: none;
  border-top: 2px solid #ef4444;
}
#console-log .error { color: #ef4444; }
#console-log .warn { color: #f59e0b; }
#console-log .info { color: #38bdf8; }
#console-log .success { color: #22c55e; }
#wasm-watchdog-error {
  display: none; position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
  z-index: 100000; max-width: 460px; padding: 12px 14px; border: 1px solid rgba(239,68,68,.35);
  border-radius: 6px; background: rgba(239,68,68,.08); color: #fca5a5;
  font-size: 11px; line-height: 1.45; text-align: center;
}
#wasm-watchdog-reload {
  display: none; position: fixed; left: 50%; top: calc(50% + 58px); transform: translateX(-50%);
  z-index: 100001; border: 1px solid var(--accent, #38bdf8); border-radius: 5px;
  padding: 7px 11px; background: transparent; color: var(--accent, #38bdf8);
  cursor: pointer; font: inherit; font-size: 12px;
}
</style>
<script>
// Console capture — forward all console output to visible DOM element
(function() {
  // Keep diagnostics useful without allowing a long-running WebView to grow
  // an unbounded DOM tree. DevTools still receives every original message;
  // this ring buffer is only the opt-in in-app/export diagnostic copy.
  var MAX_ENTRIES = 800;
  var logEl = null;
  var entries = [];
  function getLogEl() {
    if (!logEl) logEl = document.getElementById('console-log');
    return logEl;
  }
  function stringifyArgs(args) {
    try {
      // Bound each retained message as well as the number of retained
      // messages. A single giant string/object must not defeat the ring
      // buffer's memory bound.
      return Array.prototype.slice.call(args).map(function(a) {
        if (a === null) return 'null';
        if (a === undefined) return 'undefined';
        if (typeof a === 'object') { try { return JSON.stringify(a).substring(0, 500); } catch(e) { return String(a).substring(0, 500); } }
        return String(a).substring(0, 2000);
      }).join(' ').substring(0, 2000);
    } catch(e) { return 'log-capture-error'; }
  }
  function appendLine(cls, args) {
    var text = stringifyArgs(args);
    var level = cls === 'error' ? 'error' : cls === 'warn' ? 'warn' : 'info';
    entries.push({ timestamp: new Date().toISOString(), level: level, text: text });
    if (entries.length > MAX_ENTRIES) entries.shift();

    // Only warnings/errors are mirrored into the hidden DOM. High-volume
    // informational logs remain available through DevTools, not as retained
    // DOM nodes.
    var el = getLogEl();
    if (!el || (level !== 'error' && level !== 'warn')) return;
    var line = document.createElement('div');
    line.className = cls;
    line.textContent = text;
    el.appendChild(line);
    while (el.childNodes.length > MAX_ENTRIES) el.removeChild(el.firstChild);
    el.scrollTop = el.scrollHeight;
  }
  window.__athenaDiagnostics = {
    getConsole: function() {
      return JSON.stringify(entries.filter(function(entry) {
        return entry.level === 'error' || entry.level === 'warn';
      }));
    },
    getMetrics: function() {
      try {
        if (window.__athenaMetrics && typeof window.__athenaMetrics.snapshot === 'function') {
          return window.__athenaMetrics.snapshot();
        }
      } catch(e) {}
      return '{}';
    }
  };
  var _log = console.log;
  var _error = console.error;
  var _warn = console.warn;
  var _info = console.info;
  console.log = function() { appendLine('', arguments); _log.apply(console, arguments); };
  console.error = function() { appendLine('error', arguments); _error.apply(console, arguments); };
  console.warn = function() { appendLine('warn', arguments); _warn.apply(console, arguments); };
  console.info = function() { appendLine('info', arguments); _info.apply(console, arguments); };

  console.info('[BOOT] Console capture initialized');
})();

// WASM loading fix for Tauri's custom protocol
(function() {
  var _fetch = window.fetch;
  window.fetch = function(input, init) {
    var url = typeof input === 'string' ? input :
      input instanceof URL ? input.href :
      input instanceof Request ? input.url : '';
    if (url && url.endsWith('.wasm')) {
      console.info('[WASM] Intercepting fetch for:', url);
      return _fetch.apply(this, arguments).then(function(response) {
        var ct = response.headers.get('Content-Type');
        if (ct === 'application/wasm') {
          return response;
        }
        // Force correct Content-Type for instantiateStreaming()
        return response.arrayBuffer().then(function(buffer) {
          return new Response(buffer, {
            status: response.status,
            statusText: response.statusText,
            headers: { 'Content-Type': 'application/wasm' }
          });
        });
      }).catch(function(err) {
        console.error('[WASM] Fetch failed for', url, err);
        throw err;
      });
    }
    return _fetch.apply(this, arguments);
  };
  console.info('[BOOT] Fetch interceptor installed');
})();

// Error reporting with full detail
window.addEventListener('error', function(e) {
  console.error('[PAGE ERROR]', e.message, 'at', e.filename + ':' + e.lineno + ':' + e.colno);
  if (e.error) console.error('[PAGE ERROR] Stack:', e.error.stack);
  showOverlayError('Error: ' + e.message + ' at ' + (e.filename || '') + ':' + e.lineno);
});
window.addEventListener('unhandledrejection', function(e) {
  var reason = e.reason;
  console.error('[UNHANDLED REJECTION]', reason && reason.message || reason);
  if (reason && reason.stack) console.error('[UNHANDLED REJECTION] Stack:', reason.stack);
  showOverlayError('Promise error: ' + (reason && reason.message || String(reason)));
});
// Monitor the module script for load errors
var _entryScript = document.querySelector('script[src^=\"__FRONTEND_ENTRY__\"]');
if (_entryScript) {
  _entryScript.onerror = function(e) {
    showOverlayError('Failed to load entry script: ' + e);
  };
}

// Dismiss loading overlay once Dioxus mounts
function dismissOverlay() {
  var loader = document.getElementById('wasm-loading');
  if (loader) {
    loader.classList.remove('loading');
    loader.classList.add('done');
    loader.setAttribute('aria-hidden', 'true');
  }
  console.info('[MOUNT] Overlay dismissed');
}
function showOverlayError(msg) {
  console.error('[MOUNT] Fatal error:', msg);
  var errEl = document.getElementById('wasm-loading-error');
  if (errEl) {
    errEl.textContent = msg;
  }
}

// The WASM runtime cannot be revived after an `unreachable` trap. Keep the
// recovery layer in JavaScript, outside Dioxus, and only reload after a
// sustained lack of DOM progress. The reload marker prevents a crash loop from
// repeatedly tearing down and rebuilding the WebView without showing a useful
// diagnostic to the user.
(function installWasmWatchdog() {
  var heartbeatMs = 5000;
  var silenceLimitMs = 15000;
  var lastHeartbeat = Date.now();
  var reloadKey = 'athena-wasm-watchdog-reloaded';
  var stabilizationKey = 'athena-wasm-watchdog-stabilizing';
  var stabilizationMs = 30000;
  var reloadInFlight = false;
  var storageAvailable = true;
  try {
    var storageProbe = '__athena_watchdog_probe__';
    sessionStorage.setItem(storageProbe, '1');
    sessionStorage.removeItem(storageProbe);
  } catch (e) {
    storageAvailable = false;
    console.warn('[WATCHDOG] sessionStorage unavailable; auto-reload disabled');
  }
  function reportAndReload(reason) {
    if (reloadInFlight) return;
    var alreadyReloaded = false;
    var stabilizing = false;
    if (storageAvailable) {
      try {
        alreadyReloaded = sessionStorage.getItem(reloadKey) === '1';
        stabilizing = sessionStorage.getItem(stabilizationKey) === '1';
      } catch (e) {
        storageAvailable = false;
      }
    }
    var errorEl = document.getElementById('wasm-watchdog-error');
    var reloadButton = document.getElementById('wasm-watchdog-reload');
    var message = 'The interface stopped responding' + (reason ? ': ' + reason : '') + '.';
    if (errorEl) {
      errorEl.textContent = alreadyReloaded
        ? message + ' Reload was already attempted. Please quit and reopen Athena.'
        : message + ' Athena will reload once to recover the WebView.';
      errorEl.style.display = 'block';
    }
    if (alreadyReloaded || stabilizing || !storageAvailable) {
      if (reloadButton) reloadButton.style.display = 'inline-block';
      return;
    }
    reloadInFlight = true;
    try {
      sessionStorage.setItem(reloadKey, '1');
      sessionStorage.setItem(stabilizationKey, '1');
    } catch (e) {
      storageAvailable = false;
      if (reloadButton) reloadButton.style.display = 'inline-block';
      return;
    }
    console.error('[WATCHDOG] Reloading after stalled WASM runtime:', reason);
    setTimeout(function() { window.location.reload(); }, 250);
  }

  window.addEventListener('athena-wasm-heartbeat', function() {
    lastHeartbeat = Date.now();
  });
  window.__athenaWasmHeartbeat = function() {
    lastHeartbeat = Date.now();
  };
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') {
      // WebView timers may be suspended while minimized or asleep. Give the
      // WASM runtime a fresh grace period after visibility returns instead of
      // treating a stale pre-sleep timestamp as a crash.
      lastHeartbeat = Date.now();
      window.__athenaWatchdogStabilizationStarted = Date.now();
    }
  });
  window.addEventListener('error', function(event) {
    var message = event && event.message || '';
    if (/unreachable|wasm|WebAssembly|panic|dioxus/i.test(message)) {
      reportAndReload(message);
    }
  });

  setInterval(function() {
    var node = document.getElementById('main');
    var now = Date.now();
    if (document.visibilityState === 'hidden') {
      return;
    }
    // Once Dioxus has mounted, the heartbeat is the only liveness signal we
    // trust. Do not require recent user input: freezes can happen during
    // background rendering, PTY output, modal effects, or panel transitions.
    // The mount check prevents a slow cold start from being treated as a
    // runtime freeze.
    if (node && node.querySelector('[data-dioxus-id]')
      && now - lastHeartbeat > silenceLimitMs) {
      reportAndReload('no WASM heartbeat for ' + silenceLimitMs + 'ms');
    }
    if (node && node.querySelector('[data-dioxus-id]') && now - lastHeartbeat < silenceLimitMs && storageAvailable) {
      try {
        if (sessionStorage.getItem(stabilizationKey) === '1') {
          // Keep the reload marker during a post-reload stabilization window;
          // a second freeze in that window must require explicit recovery.
          if (!window.__athenaWatchdogStabilizationStarted) {
            window.__athenaWatchdogStabilizationStarted = now;
          }
          if (now - window.__athenaWatchdogStabilizationStarted >= stabilizationMs) {
            sessionStorage.removeItem(reloadKey);
            sessionStorage.removeItem(stabilizationKey);
          }
        } else {
          sessionStorage.removeItem(reloadKey);
        }
      } catch (e) { storageAvailable = false; }
    }
  }, heartbeatMs);
})();
var _checkCount = 0;
var _checkInterval = setInterval(function() {
  _checkCount++;
  var main = document.getElementById('main');
  if (!main) { if (_checkCount % 5 === 0) console.warn('[MOUNT] #main not found yet'); return; }
  if (main.querySelector('[data-dioxus-id]')) {
    console.info('[MOUNT] Dioxus data-dioxus-id attribute detected!');
    dismissOverlay();
    clearInterval(_checkInterval);
    return;
  }
  var childCount = main.children.length;
  for (var i = 0; i < childCount; i++) {
    var child = main.children[i];
    if (child.id !== 'wasm-loading' && child.id !== 'console-log') {
      console.info('[MOUNT] Non-loader child detected:', child.tagName, child.id || '(no id)');
      dismissOverlay();
      clearInterval(_checkInterval);
      return;
    }
  }
  if (_checkCount % 10 === 0) {
    console.info('[MOUNT] Check #' + _checkCount + ': still waiting, children:', childCount);
  }
  if (_checkCount > 150) {
    clearInterval(_checkInterval);
    console.error('[MOUNT] TIMEOUT after 30s - WASM did not initialize');
    var errEl = document.getElementById('wasm-loading-error');
    if (errEl && !errEl.textContent) {
      errEl.textContent = 'WASM did not initialize within 30s. Check console below.';
    }
    dismissOverlay();
  }
}, 200);

// Log the environment info
console.info('[BOOT] Page loaded, base URL:', document.baseURI);
console.info('[BOOT] Location:', window.location.href);
console.info('[BOOT] Protocol:', window.location.protocol);

// Monitor script loading
var _origCreate = document.createElement.bind(document);
document.createElement = function(tag) {
  var el = _origCreate(tag);
  if (tag.toLowerCase() === 'script') {
    console.info('[LOADER] Script element created');
  }
  return el;
};

// Browse button: intercept clicks on "Browse" buttons and open native folder dialog.
// The WASM invoke wrapper fails in Dioxus spawn(async) context due to __TAURI__.core
// cast issues in WKWebView, so we handle it entirely in JS.
document.addEventListener('click', function(event) {
  var target = event.target;
  if (target && target.nodeType === 3) target = target.parentElement;
  var btn = target && target.closest ? target.closest('button') : null;
  if (!btn) return;
  if ((btn.textContent || '').trim() !== 'Browse') return;

  event.stopPropagation();
  event.preventDefault();

  var input = btn.parentElement ? btn.parentElement.querySelector('input') : null;
  if (!input) {
    console.error('[BROWSE-JS] No input found next to Browse button');
    return;
  }

  var invoke = null;
  try {
    if (window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke) {
      invoke = window.__TAURI__.core.invoke;
    }
  } catch(e) {}
  if (!invoke) {
    console.error('[BROWSE-JS] Tauri invoke not available');
    return;
  }

  invoke('fs_show_open_dialog', {
    title: 'Select Working Directory',
    directory: true,
    multiple: false
  }).then(function(result) {
    console.info('[BROWSE-JS] dialog returned:', result);
    if (typeof result === 'string' && result.trim() && result.trim() !== 'null') {
      var nativeSetter = Object.getOwnPropertyDescriptor(
        HTMLInputElement.prototype, 'value'
      ).set;
      nativeSetter.call(input, result.trim());
      input.dispatchEvent(new Event('input', { bubbles: true }));
      input.dispatchEvent(new Event('change', { bubbles: true }));
    }
  }).catch(function(err) {
    console.error('[BROWSE-JS] dialog error:', err);
  });
}, true);
</script>
<link rel="preload" as="script" href="__FRONTEND_ENTRY__" crossorigin></head>
<body>
<div id="main">
  <div id="wasm-loading" class="loading">
    <div class="spinner"></div>
    <div style="font-size: 13px;">Loading Athena's Core...</div>
    <div id="wasm-loading-error" style="font-size: 11px; color: #ef4444; max-width: 400px; text-align: center;"></div>
  </div>
</div>
<div id="wasm-watchdog-error"></div>
<button id="wasm-watchdog-reload" type="button" onclick="try { sessionStorage.removeItem('athena-wasm-watchdog-reloaded'); sessionStorage.removeItem('athena-wasm-watchdog-stabilizing'); } catch (e) {} window.location.reload();">Reload interface</button>
<div id="console-log"></div>
<script src="./vendor/xterm/xterm.js"></script>
<script src="./vendor/xterm/addon-fit.js"></script>
<script src="./vendor/xterm/addon-web-links.js"></script>
<script src="./vendor/xterm/addon-unicode11.js"></script>
<script src="./vendor/xterm/addon-search.js"></script>
<script src="./vendor/xterm/addon-serialize.js"></script>
<script type="module" async src="__FRONTEND_ENTRY__"></script>
</body>
</html>
