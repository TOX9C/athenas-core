[package]
name = "athena-frontend"
version = "0.1.0"
edition = "2021"

[lib]
name = "athena_frontend"
path = "src/lib.rs"

[[bin]]
name = "athena-frontend"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7", features = ["web"] }
dioxus-web = { version = "0.7", default-features = false, features = ["mounted", "document"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "Window", "Document", "Element", "HtmlElement", "CssStyleDeclaration", "MediaQueryList", "KeyboardEvent", "Navigator", "AudioContext", "AudioDestinationNode", "AudioNode", "OscillatorNode", "GainNode"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
log = "0.4"
console_error_panic_hook = "0.1"
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
regex = "1.10"
strum = { version = "0.26", features = ["derive"] }
strum_macros = "0.26"
gloo = { version = "0.11", features = ["futures", "timers"] }
uuid = { version = "1", default-features = false, features = ["v4", "js"] }
parking_lot = "0.12"

[features]
default = ["xterm"]
xterm = []
legacy-renderer = []
