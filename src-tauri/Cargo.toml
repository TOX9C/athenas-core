[package]
name = "athenas-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }

athena-core = { path = "../crates/athena-core" }
athena-terminal = { path = "../crates/athena-terminal" }
athena-fs = { path = "../crates/athena-fs" }
athena-store = { path = "../crates/athena-store" }
athena-browser = { path = "../crates/athena-browser" }
athena-plugins = { path = "../crates/athena-plugins" }

[build-dependencies]
tauri-build = { version = "2", features = [] }
