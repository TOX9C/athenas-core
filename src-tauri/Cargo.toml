[package]
name = "athenas-core"
version = "3.4.1"
edition = "2021"
rust-version = "1.82"

[dependencies]
# `devtools`: tauri compiles the inspector out of release builds
# automatically (it is debug-assertions gated upstream), so keeping it
# unconditional is safe and keeps `tauri dev` zero-config.
# `unstable`: required by APIs used across commands/window management; Tauri
# offers no per-feature narrowing for these, so it stays enabled.
tauri = { version = "2.0", features = ["devtools", "unstable"] }
regex = "1.10"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
# Persist the main window's size, position, and maximized state across
# relaunches (saved on exit/resize/move, restored on startup).
tauri-plugin-window-state = "2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1.43", features = ["rt", "sync", "time", "fs", "macros"] }
log = { workspace = true }
base64 = "0.22"
tauri-runtime = "2"
uuid = { workspace = true }
# keyring v3 ships NO default backends — without an explicit platform
# feature it silently falls back to an in-memory mock store that loses the
# secret when the process exits. That made the API key "save" successfully
# but vanish on app restart (base URL + model survived because they use the
# SQLite store, not the keyring). Enable the native backend for each OS so
# the key is persisted in the OS keychain / credential store.
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "linux-native-sync-persistent",
    "crypto-rust",
] }
# Used for platform-native log and diagnostics export locations.
dirs = "6"
parking_lot = { version = "0.12", features = ["send_guard"] }
# athena-fs is deliberately not listed here even though athena-core re-uses
# it: the app must not depend on it directly (it was an unused duplicate
# dependency); it reaches the graph transitively via athena-core.
athena-core = { path = "../crates/athena-core" }
athena-git = { path = "../crates/athena-git" }
athena-store = { path = "../crates/athena-store" }
athena-browser = { path = "../crates/athena-browser" }
athena-plugins = { path = "../crates/athena-plugins" }
athena-terminal = { path = "../crates/athena-terminal" }
# Already in the dependency tree (pinned at 0.12.28 by athena-core) — declared
# here so the license-activation commands can call the Lemon Squeezy API
# without adding any new crate to the graph.
reqwest = { version = "0.12", features = ["json"] }

# WebDriver automation plugin: optional behind the `webdriver` feature and
# only REGISTERED in debug builds (main.rs gates on cfg(debug_assertions) +
# TAURI_WEBVIEW_AUTOMATION). Cargo cannot conditionalize dependencies on
# debug_assertions ([target.'cfg(debug_assertions)'] is unsupported), so the
# dep stays optional and release builds avoid it by leaving the feature off
# the default set; the e2e runner builds with `--features webdriver`.
tauri-plugin-webdriver-automation = { version = "0.1.3", optional = true }

# ── Mobile mirror relay ───────────────────────────────────────────────────────
# Serves the desktop frontend dist + WS bridge to the real command handlers,
# so a phone WebView on the same network loads the ACTUAL app interface.
# Bound to an ephemeral port on 0.0.0.0 (fresh per start) for trusted-LAN
# pairing; the pairing token is likewise regenerated per start. Runtime-toggled
# from Settings (persisted, default off) — see the `relay_*` Tauri commands and
# `relay::RelayHandle`. This is experimental and must not be exposed to the
# public internet.
axum = { version = "0.7", features = ["ws"], optional = true }
tower-http = { version = "0.6", features = ["fs", "cors"], optional = true }
qrcode = { version = "0.14", features = ["svg"], optional = true }
local-ip-address = { version = "0.6", optional = true }
futures-util = "0.3"
mdns-sd = { version = "0.11", optional = true }

# ── Athena voice input ───────────────────────────────────────────────────────
# Microphone capture (cpal) → WAV (hound) → macOS on-device speech recognition
# (Apple Speech framework via the auto-generated objc2 bindings — pure
# Objective-C, no Swift runtime, so it works on macOS 13–26 without bundling
# Swift dylibs; macOS-26 dropped the Swift concurrency runtime from the OS).
cpal = { version = "0.14", optional = true }
hound = { version = "3", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
block2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", features = ["NSBundle", "NSError", "NSString", "NSURL"], optional = true }
objc2-speech = { version = "0.3", optional = true }

[features]
# Both feature groups are on by default so release behavior is unchanged;
# they exist so minimal builds can drop the relay/mic dependency trees.
default = ["voice", "relay"]
voice = [
    "dep:cpal",
    "dep:hound",
    "dep:objc2",
    "dep:block2",
    "dep:objc2-foundation",
    "dep:objc2-speech",
]
relay = [
    "dep:axum",
    "dep:tower-http",
    "dep:qrcode",
    "dep:mdns-sd",
    "dep:local-ip-address",
]
# WebDriver e2e automation. Off by default so release builds/link never see
# the plugin; main.rs registers it only in debug builds behind
# TAURI_WEBVIEW_AUTOMATION. E2e runners must build with `--features webdriver`.
webdriver = ["dep:tauri-plugin-webdriver-automation"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
